[package]
name = "proof_of_concept"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = {version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
